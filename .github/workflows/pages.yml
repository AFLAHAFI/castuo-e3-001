name: Demo site (GitHub Pages)

# Builds the browser demo with example bundles and CLI from an immutable v0.1.2
# candidate source commit (not copied by hand), proves browser/CLI conformance, and
# permits production deployment only after release, PyPI and GHCR artifacts exist.

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Immutable pre-release candidate source; do not claim a tag before publication.
  CLI_REF: 50b2dde7309f147d39fbb1ac7e7fc9cf00310e4c
  LOGO_SHA256: 54be9cdc29d888b6709478058800cbed31630f1aaca7abf578eec27896cdc78d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the CLI dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=50.0.2"
      - name: Extract example bundles and candidate CLI from the pinned source commit
        run: |
          mkdir -p candidate
          git archive "$CLI_REF" examples/bundles scripts/e3bundle.py | tar -x -C candidate
      - name: JavaScript syntax
        run: for f in docs/demo/*.js docs/demo/tests/*.mjs; do node --check "$f"; done
      - name: Conformance with the v0.1.2 candidate CLI (8 scenarios + interop)
        run: node docs/demo/tests/conformance.mjs candidate/examples/bundles python candidate/scripts/e3bundle.py
      - name: Record actual candidate manifest hash from CLI verification
        run: |
          python candidate/scripts/e3bundle.py verify candidate/examples/bundles/valid \
            --min-signatures 2 \
            --trusted-keys candidate/examples/bundles/trusted-keys.json \
            > /tmp/e3bundle-candidate-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("/tmp/e3bundle-candidate-report.json").read_text(encoding="utf-8"))
          assert report["status"] == "VERIFIED", report
          assert report["files_verified"] == report["files_declared"], report
          print("candidate_manifest_hash=" + report["manifest_hash"])
          print("candidate_verification_status=" + report["status"])
          print("candidate_files=" + str(report["files_verified"]) + "/" + str(report["files_declared"]))
          PY
      - name: Local import rules (paths, limits, decoding)
        run: node docs/demo/tests/importer.mjs
      - name: Input conformance with the v0.1.2 candidate CLI (malformed inputs and unsafe paths)
        run: node docs/demo/tests/input-conformance.mjs candidate/examples/bundles python candidate/scripts/e3bundle.py
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp docs/demo/index.html docs/demo/crear.html docs/demo/styles.css docs/demo/verifier.js docs/demo/demo.js docs/demo/crear.js docs/demo/input.js docs/demo/importer.js docs/demo/paquete.html docs/demo/paquete.js _site/
          cp docs/demo/assets/logo.jpg _site/assets/
          cp -r candidate/examples/bundles _site/bundles
          touch _site/.nojekyll
      - name: Official logo is unmodified
        run: echo "${LOGO_SHA256}  _site/assets/logo.jpg" | sha256sum -c -
      - name: No unsupported claims on the pages
        run: |
          if grep -RinE "blockchain|garantiza|24/7|certificad[oa] por|conforme a regulaciones" _site/*.html; then
            echo "unsupported claim found" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Keep the assembled site for the UI tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-site
          path: _site
          include-hidden-files: true
          retention-days: 7

  ui:
    # Browser tests of the assembled site: scenarios, ERROR on unreadable input, reset,
    # no request leaving the page, CSP enforcement, keyboard, no overflow at 375/768/1440.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: docs/demo/tests/ui
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python (static server)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Candidate CLI for the local-bundle comparison
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=50.0.2"
          mkdir -p candidate
          git archive "$CLI_REF" scripts/e3bundle.py | tar -x -C candidate
      - name: Download the assembled site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-site
          path: _site
      - name: Install test runner
        run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests (${{ matrix.browser }})
        # The site is downloaded to <repo>/_site, the config's default location. paquete.spec
        # compares each local folder with `e3bundle verify` from the pinned candidate source commit.
        env:
          E3_CLI: ${{ github.workspace }}/candidate/scripts/e3bundle.py
          E3_PYTHON: python
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            docs/demo/tests/ui/playwright-report
            docs/demo/tests/ui/test-results
          retention-days: 14

  publication_gate:
    # PRs may build/test the candidate, but public deployment stays blocked until
    # GitHub release v0.1.2, PyPI e3bundle 0.1.2 and GHCR image 0.1.2 are available.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check public v0.1.2 release, PyPI distribution and GHCR image
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_code=$(curl --silent --show-error --output /tmp/e3-release.json --write-out '%{http_code}' \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/Traky12/castuo-e3-001/releases/tags/v0.1.2)
          if [ "$release_code" != "200" ] || ! python -c 'import json; r=json.load(open("/tmp/e3-release.json")); raise SystemExit(0 if r.get("tag_name") == "v0.1.2" and not r.get("draft", True) and r.get("prerelease") is True else 1)'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "v0.1.2 is not a published alpha release; Pages deployment remains blocked."
            exit 0
          fi
          if ! curl --fail --silent --show-error https://pypi.org/pypi/e3bundle/0.1.2/json --output /tmp/e3-pypi.json ||
             ! python -c 'import json; r=json.load(open("/tmp/e3-pypi.json")); raise SystemExit(0 if r.get("info", {}).get("version") == "0.1.2" else 1)'; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "e3bundle 0.1.2 is not available on PyPI; Pages deployment remains blocked."
            exit 0
          fi
          if ! docker manifest inspect ghcr.io/traky12/e3bundle:0.1.2 >/dev/null 2>&1; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "GHCR image 0.1.2 is not available; Pages deployment remains blocked."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Publication gate passed: public release, PyPI 0.1.2 and GHCR image 0.1.2 are available."

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.publication_gate.outputs.ready == 'true'
    needs: [build, ui, publication_gate]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
