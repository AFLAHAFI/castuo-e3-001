name: Demo site (GitHub Pages)

# Builds the browser demo from docs/demo with the example bundles and CLI taken
# from the release tag (not copied by hand), proves the browser verifier gives
# the same results as that CLI, and deploys to GitHub Pages from main only.

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.1
  LOGO_SHA256: 54be9cdc29d888b6709478058800cbed31630f1aaca7abf578eec27896cdc78d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install the CLI dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=50.0.2"
      - name: Extract example bundles and CLI from the release tag
        run: |
          mkdir -p release
          git archive "$RELEASE_TAG" examples/bundles scripts/e3bundle.py | tar -x -C release
      - name: JavaScript syntax
        run: for f in docs/demo/*.js docs/demo/tests/*.mjs; do node --check "$f"; done
      - name: Conformance with the released CLI (8 scenarios + interop)
        run: node docs/demo/tests/conformance.mjs release/examples/bundles python release/scripts/e3bundle.py
      - name: Local import rules (paths, limits, decoding)
        run: node docs/demo/tests/importer.mjs
      - name: Input conformance with the released CLI (malformed inputs)
        run: node docs/demo/tests/input-conformance.mjs release/examples/bundles python release/scripts/e3bundle.py
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp docs/demo/index.html docs/demo/crear.html docs/demo/styles.css docs/demo/verifier.js docs/demo/demo.js docs/demo/crear.js docs/demo/input.js docs/demo/importer.js docs/demo/paquete.html docs/demo/paquete.js _site/
          cp docs/demo/assets/logo.jpg _site/assets/
          cp -r release/examples/bundles _site/bundles
          touch _site/.nojekyll
      - name: Official logo is unmodified
        run: echo "${LOGO_SHA256}  _site/assets/logo.jpg" | sha256sum -c -
      - name: No unsupported claims on the pages
        run: |
          if grep -RinE "blockchain|garantiza|24/7|certificad[oa] por|conforme a regulaciones" _site/*.html; then
            echo "unsupported claim found" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - name: Keep the assembled site for the UI tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-site
          path: _site
          include-hidden-files: true
          retention-days: 7

  ui:
    # Browser tests of the assembled site: scenarios, ERROR on unreadable input, reset,
    # no request leaving the page, CSP enforcement, keyboard, no overflow at 375/768/1440.
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: docs/demo/tests/ui
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Set up Python (static server)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Released CLI for the local-bundle comparison
        working-directory: .
        run: |
          python -m pip install --disable-pip-version-check "cryptography>=50.0.2"
          mkdir -p release
          git archive "$RELEASE_TAG" scripts/e3bundle.py | tar -x -C release
      - name: Download the assembled site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: demo-site
          path: _site
      - name: Install test runner
        run: npm ci --no-audit --no-fund
      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run UI tests (${{ matrix.browser }})
        # The site is downloaded to <repo>/_site, the config's default location. paquete.spec
        # compares each local folder with `e3bundle verify` from the release tag.
        env:
          E3_CLI: ${{ github.workspace }}/release/scripts/e3bundle.py
          E3_PYTHON: python
        run: npx playwright test --project=${{ matrix.browser }}
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            docs/demo/tests/ui/playwright-report
            docs/demo/tests/ui/test-results
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [build, ui]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
