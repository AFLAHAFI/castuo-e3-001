name: Demo site (GitHub Pages)

# Builds the browser demo from docs/demo with the example bundles and CLI taken
# from the release tag (not copied by hand), proves the browser verifier gives
# the same results as that CLI, and deploys to GitHub Pages from main only.

on:
  push:
    branches: [main]
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.1
  LOGO_SHA256: 54be9cdc29d888b6709478058800cbed31630f1aaca7abf578eec27896cdc78d

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with tags)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: Install the CLI dependency
        run: python -m pip install --disable-pip-version-check "cryptography>=50.0.2"
      - name: Extract example bundles and CLI from the release tag
        run: |
          mkdir -p release
          git archive "$RELEASE_TAG" examples/bundles scripts/e3bundle.py | tar -x -C release
      - name: JavaScript syntax
        run: for f in docs/demo/*.js docs/demo/tests/*.mjs; do node --check "$f"; done
      - name: Conformance with the released CLI (8 scenarios + interop)
        run: node docs/demo/tests/conformance.mjs release/examples/bundles python release/scripts/e3bundle.py
      - name: Assemble site
        run: |
          mkdir -p _site/assets
          cp docs/demo/index.html docs/demo/crear.html docs/demo/styles.css docs/demo/verifier.js docs/demo/demo.js docs/demo/crear.js _site/
          cp docs/demo/assets/logo.jpg _site/assets/
          cp -r release/examples/bundles _site/bundles
          touch _site/.nojekyll
      - name: Official logo is unmodified
        run: echo "${LOGO_SHA256}  _site/assets/logo.jpg" | sha256sum -c -
      - name: No unsupported claims on the pages
        run: |
          if grep -RinE "blockchain|garantiza|24/7|certificad[oa] por|conforme a regulaciones" _site/*.html; then
            echo "unsupported claim found" >&2
            exit 1
          fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
