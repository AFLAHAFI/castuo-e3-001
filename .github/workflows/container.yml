name: Container image

# Builds the e3bundle CLI image and smoke-tests it on every relevant PR.
# On a published release (or a manual run for an existing tag) it builds from
# the tag's source with this Dockerfile, publishes ghcr.io/traky12/e3bundle for
# linux/amd64 and linux/arm64 with SBOM and build provenance, and attests it.
# Uses GITHUB_TOKEN only; no stored secrets.

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "scripts/e3bundle.py"
      - ".github/workflows/container.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example v0.1.2)"
        required: true
        default: "v0.1.2"

permissions:
  contents: read

env:
  IMAGE: ghcr.io/traky12/e3bundle

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.src.outputs.ref }}
      version: ${{ steps.src.outputs.version }}
      minor: ${{ steps.src.outputs.minor }}
    steps:
      - name: Checkout workflow and Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve the source to build
        id: src
        env:
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            release) ref="$RELEASE_TAG" ;;
            workflow_dispatch) ref="$INPUT_TAG" ;;
            *) ref="$HEAD_SHA" ;;
          esac
          if [ "$EVENT" != "pull_request" ]; then
            echo "$ref" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "not a release tag: $ref" >&2; exit 1; }
            version="${ref#v}"
          else
            version="pr"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "minor=${version%.*}" >> "$GITHUB_OUTPUT"
      - name: Checkout the source at that ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.src.outputs.ref }}
          path: src
      - name: Tag must match pyproject version
        if: github.event_name != 'pull_request'
        env:
          VERSION: ${{ steps.src.outputs.version }}
        run: |
          found=$(python3 -c "import tomllib; print(tomllib.load(open('src/pyproject.toml','rb'))['project']['version'])")
          test "$found" = "$VERSION" || { echo "pyproject version $found does not match tag v$VERSION" >&2; exit 1; }
      - name: Build (local, single architecture)
        env:
          VERSION: ${{ steps.src.outputs.version }}
        run: docker build -f Dockerfile -t e3bundle:test --build-arg VERSION="$VERSION" --build-arg REVISION="$(git -C src rev-parse HEAD)" src
      - name: Smoke test (valid passes, tampered fails, non-root)
        run: |
          set -u
          run() { docker run --rm -v "$PWD/src/examples/bundles:/data:ro" e3bundle:test verify "$1" --min-signatures 2 --trusted-keys trusted-keys.json --format text; }
          run valid || { echo "valid bundle did not verify" >&2; exit 1; }
          if out=$(run tampered); then echo "tampered bundle was accepted" >&2; exit 1; fi
          echo "$out" | grep -q "hash mismatch: data/readings.csv" || { echo "unexpected tampered output: $out" >&2; exit 1; }
          uid=$(docker run --rm --entrypoint id e3bundle:test -u)
          test "$uid" != "0" || { echo "image runs as root" >&2; exit 1; }
          echo "smoke test passed (uid $uid)"

  publish:
    if: github.event_name != 'pull_request'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout workflow and Dockerfile
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build-test.outputs.ref }}
          path: src
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Revision
        id: rev
        run: |
          echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git -C src rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ needs.build-test.outputs.version }}
            type=raw,value=${{ needs.build-test.outputs.minor }}
            type=raw,value=sha-${{ steps.rev.outputs.short }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ steps.rev.outputs.sha }}
            org.opencontainers.image.version=${{ needs.build-test.outputs.version }}
      - name: Build and push (amd64, arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: src
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.build-test.outputs.version }}
            REVISION=${{ steps.rev.outputs.sha }}
          provenance: mode=max
          sbom: true
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.build-test.outputs.version }}
        run: |
          {
            echo "### Published ${IMAGE}:${VERSION}"
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "\`docker run --rm -v \"\$PWD:/data\" ${IMAGE}@${DIGEST} verify <bundle> ...\`"
          } >> "$GITHUB_STEP_SUMMARY"
