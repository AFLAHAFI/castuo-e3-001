name: Publish to PyPI

# Runs only when a GitHub release is published. Uses PyPI Trusted Publishing
# (OIDC): no API token is stored in this repository. The maintainer must first
# register this workflow as a trusted publisher for the `e3bundle` project on PyPI.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Version must match the release tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v${version}" = "${TAG}" || { echo "pyproject version ${version} does not match tag ${TAG}" >&2; exit 1; }
      - name: Tests must pass before publishing
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt pytest
          python -m pytest tests -q
      - name: Build sdist and wheel
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
      - name: Clean-venv smoke test of the wheel
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --disable-pip-version-check dist/*.whl
          /tmp/clean/bin/e3bundle verify examples/bundles/valid --min-signatures 2 --trusted-keys examples/bundles/trusted-keys.json --format text
          if /tmp/clean/bin/e3bundle verify examples/bundles/tampered --min-signatures 2 --trusted-keys examples/bundles/trusted-keys.json --format text; then
            echo "tampered example was accepted" >&2
            exit 1
          fi
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/e3bundle/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
