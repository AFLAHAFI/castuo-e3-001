name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest
      - name: Unit tests
        run: python -m pytest tests -v
      - name: README quickstart (valid demo must pass, tampered demo must fail)
        run: |
          python examples/make_demo_bundle.py demo/ok
          python scripts/validate_external_evidence_bundle.py demo/ok --output demo/ok-validation.json
          python examples/make_demo_bundle.py demo/bad --tamper result
          if python scripts/validate_external_evidence_bundle.py demo/bad --output demo/bad-validation.json; then
            echo "tampered demo bundle was accepted" >&2
            exit 1
          fi
      - name: e3bundle quickstart (sign, verify, tamper must fail)
        run: |
          mkdir -p keys bundle
          printf 't,value\n0,21.5\n' > bundle/readings.csv
          python scripts/e3bundle.py keygen --private-key keys/alice.key --signer-id alice
          python scripts/e3bundle.py manifest bundle --bundle-id ci-smoke
          python scripts/e3bundle.py sign bundle --private-key keys/alice.key --signer-id alice --role reviewer
          python -c "import json; k=json.load(open('keys/alice.pub.json')); json.dump({k['signer_id']: k['public_key_b64']}, open('trusted.json','w'))"
          python scripts/e3bundle.py verify bundle --min-signatures 1 --trusted-keys trusted.json
          printf 't,value\n0,99.9\n' > bundle/readings.csv
          if python scripts/e3bundle.py verify bundle --min-signatures 1 --trusted-keys trusted.json; then
            echo "tampered bundle was accepted" >&2
            exit 1
          fi

  action:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Valid example must verify
        id: valid
        uses: ./
        with:
          bundle: examples/bundles/valid
          min-signatures: "2"
          trusted-keys: examples/bundles/trusted-keys.json
          report-path: reports/valid.json
      - name: Tampered example reports FAILED (fail-on-error false)
        id: tampered
        uses: ./
        with:
          bundle: examples/bundles/tampered
          min-signatures: "2"
          trusted-keys: examples/bundles/trusted-keys.json
          report-path: reports/tampered.json
          fail-on-error: "false"
      - name: Tampered example fails the step by default
        id: tampered_default
        continue-on-error: true
        uses: ./
        with:
          bundle: examples/bundles/tampered
          min-signatures: "2"
          trusted-keys: examples/bundles/trusted-keys.json
          report-path: reports/tampered-default.json
      - name: Assert outcomes
        env:
          VALID_STATUS: ${{ steps.valid.outputs.status }}
          TAMPERED_STATUS: ${{ steps.tampered.outputs.status }}
          DEFAULT_OUTCOME: ${{ steps.tampered_default.outcome }}
        run: |
          test "$VALID_STATUS" = VERIFIED
          test "$TAMPERED_STATUS" = FAILED
          test "$DEFAULT_OUTCOME" = failure
          grep -q 'hash mismatch: data/readings.csv' reports/tampered.json
          grep -q 'hash mismatch: data/readings.csv' reports/tampered-default.json

  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel, install the wheel in a clean venv
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --disable-pip-version-check dist/*.whl
          cd /tmp
          /tmp/clean/bin/e3bundle verify "$GITHUB_WORKSPACE/examples/bundles/valid" --min-signatures 2 --trusted-keys "$GITHUB_WORKSPACE/examples/bundles/trusted-keys.json"
