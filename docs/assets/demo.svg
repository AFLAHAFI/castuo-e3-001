<svg xmlns="http://www.w3.org/2000/svg" width="860" height="250" viewBox="0 0 860 250" role="img" aria-labelledby="t d">
  <title id="t">e3bundle verify: valid and tampered example bundles</title>
  <desc id="d">Real output of e3bundle with --format text. The valid bundle verifies with exit code 0. The tampered bundle fails with hash mismatch: data/readings.csv and exit code 1.</desc>
  <rect width="860" height="250" rx="10" fill="#0f1411"/>
  <circle cx="22" cy="20" r="5" fill="#b2382d"/>
  <circle cx="40" cy="20" r="5" fill="#c9a24a"/>
  <circle cx="58" cy="20" r="5" fill="#3e8a2c"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5">
    <text x="22" y="58" fill="#8f998e">$ e3bundle verify examples/bundles/valid --min-signatures 2 --trusted-keys … --format text</text>
    <text x="22" y="82" fill="#e9ede4"><tspan fill="#9fd283" font-weight="bold">VERIFIED</tspan>  example-001  files 2/2  signatures 2 trusted / 2 valid</text>
    <text x="22" y="104" fill="#8f998e">exit 0</text>
    <text x="22" y="146" fill="#8f998e">$ e3bundle verify examples/bundles/tampered --min-signatures 2 --trusted-keys … --format text</text>
    <text x="22" y="170" fill="#e9ede4"><tspan fill="#f0968c" font-weight="bold">FAILED</tspan>  example-001  files 1/2  signatures 2 trusted / 2 valid</text>
    <text x="22" y="192" fill="#e9ede4">  - hash mismatch: data/readings.csv</text>
    <text x="22" y="214" fill="#8f998e">exit 1</text>
  </g>
  <text x="838" y="236" text-anchor="end" font-family="system-ui, sans-serif" font-size="11" fill="#8f998e">synthetic example bundles · same commands run in CI</text>
</svg>
